aid: truelayer
name: TrueLayer
description: TrueLayer is Europe's leading open banking platform providing unified
  access to bank data, payments, payouts, refunds, and variable recurring payments
  across the UK and EU. TrueLayer connects to 69+ financial institutions and enables
  instant bank payments, data enrichment, and account verification through a single
  API.
